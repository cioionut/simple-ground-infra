---
# Node-level registry name resolution only.
#
# containerd performs image pulls and uses the node resolver, not CoreDNS, so
# `registry_domain` must resolve on each node. Writing /etc/hosts (and the
# cloud-init hosts template, so a rebuilt VM keeps it) is what makes that work
# when the LAN resolver does not answer for the name.
#
# No `/etc/rancher/k3s/registries.yaml` is written. For a registry that serves a
# publicly trusted certificate and answers anonymously, containerd's defaults
# (HTTPS, system CA bundle, no credentials) are exactly what the old
# mirror/auth/TLS block restated. Verified on ib0d: with the file removed and
# k3s restarted, containerd resolved and pulled without a 401.
#
# Re-add a registries.yaml only when the facts change:
#   - private/self-signed CA -> `tls.ca_file` (not `insecure_skip_verify`)
#   - real registry auth    -> `auth` with credentials from vault
#   - pull-through cache    -> `mirrors` with a genuinely different endpoint
- name: 1. Discover cloud-init hosts templates
  ansible.builtin.find:
    paths: /etc/cloud/templates
    patterns: "hosts*.tmpl"
    file_type: file
  register: post_install_cloud_init_hosts_templates
  # This prevents failure on VMs where /etc/cloud/ doesn't exist
  failed_when: false
  changed_when: false

- name: 2. Build hosts files to update
  ansible.builtin.set_fact:
    post_install_hosts_files: >-
      {{
        (
          ['/etc/hosts']
          + (
            post_install_cloud_init_hosts_templates.files
            | default([])
            | map(attribute='path')
            | list
          )
        )
        | unique
      }}

- name: 3. Add registry to hosts files
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^.*{{ registry_domain | regex_escape() }}$"
    line: "{{ registry_ip }} {{ registry_domain }}"
    state: present
    backup: true
  loop: "{{ post_install_hosts_files }}"
  loop_control:
    label: "{{ item }}"
