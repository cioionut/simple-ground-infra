---
- name: 1. Discover cloud-init hosts templates
  ansible.builtin.find:
    paths: /etc/cloud/templates
    patterns: "hosts*.tmpl"
    file_type: file
  register: post_install_cloud_init_hosts_templates
  # This prevents failure on VMs where /etc/cloud/ doesn't exist
  failed_when: false
  changed_when: false

- name: 2. Build hosts files to update
  ansible.builtin.set_fact:
    post_install_hosts_files: >-
      {{
        (
          ['/etc/hosts']
          + (
            post_install_cloud_init_hosts_templates.files
            | default([])
            | map(attribute='path')
            | list
          )
        )
        | unique
      }}

- name: 3. Add registry to hosts files
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^.*{{ registry_domain | regex_escape() }}$"
    line: "{{ registry_ip }} {{ registry_domain }}"
    state: present
    backup: true
  loop: "{{ post_install_hosts_files }}"
  loop_control:
    label: "{{ item }}"

- name: 4. Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: 5. Configure K3s registries.yaml
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    content: |
      mirrors:
        "{{ registry_domain }}":
          endpoint:
            - "https://{{ registry_domain }}"
      configs:
        "{{ registry_domain }}":
          tls:
            # Debian/RHEL YAML parser preference: strictly boolean
            insecure_skip_verify: {{ insecure_skip_verify | lower }}
          auth:
            username: "{{ registry_domain_username }}"
            password: "{{ registry_domain_password }}"
    mode: '0644'
  register: registry_config

- name: 6. Restart K3s to apply registry changes
  ansible.builtin.systemd:
    # Logic remains same for RHEL/Debian as K3s uses standard service names
    name: "{{ 'k3s' if 'server' in group_names else 'k3s-agent' }}"
    state: restarted
    daemon_reload: true
  when: registry_config.changed
